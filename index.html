<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일본어 간판·메뉴 공부</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="noren">
    <div class="noren-inner">
      <h1>看板・メニューで日本語</h1>
      <p>실제 일본 간판·메뉴 사진으로 배우는 일본어 — 사진을 자동으로 찾거나, 내가 찍은 사진을 올려 보세요</p>
    </div>
  </header>

  <main class="wrap">

    <section class="controls" aria-label="설정">
      <div class="field">
        <label for="apiKey">Claude API 키</label>
        <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      </div>
      <label class="check">
        <input id="saveKey" type="checkbox">
        이 브라우저에 키 저장 (공용 컴퓨터에서는 끄세요)
      </label>

      <div class="field">
        <label for="level">내 수준</label>
        <select id="level">
          <option value="N5">N5 (입문)</option>
          <option value="N4" selected>N4</option>
          <option value="N3">N3</option>
          <option value="N2">N2</option>
          <option value="N1">N1 (상급)</option>
        </select>
      </div>

      <div class="tabs" role="tablist" aria-label="자료 만드는 방법">
        <button id="tabAuto" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panelAuto">사진 자동으로 찾기</button>
        <button id="tabUpload" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panelUpload">내 사진 올리기</button>
      </div>

      <div id="panelAuto" class="panel" role="tabpanel" aria-labelledby="tabAuto">
        <div class="field">
          <label for="kind">종류</label>
          <select id="kind">
            <option value="random">랜덤</option>
            <option value="sign">가게 간판</option>
            <option value="menu">메뉴판</option>
            <option value="station">전철·역 안내판</option>
            <option value="pop">마트·편의점 POP/가격표</option>
            <option value="warning">주의·경고문</option>
            <option value="vending">자판기</option>
          </select>
        </div>
        <button id="generate" class="btn-generate" type="button">생성하기!</button>
      </div>

      <div id="panelUpload" class="panel" role="tabpanel" aria-labelledby="tabUpload" hidden>
        <label id="drop" class="drop" for="photoFile">
          <span class="drop-main">여기를 눌러 사진을 고르거나, 끌어다 놓으세요</span>
          <span class="drop-sub">여행 중 찍은 간판·메뉴·안내판 사진 (JPG, PNG, WEBP)</span>
          <img id="preview" alt="올린 사진 미리보기" hidden>
        </label>
        <input id="photoFile" class="visually-hidden" type="file" accept="image/*">
        <p class="note">올린 사진은 내 API 키로 Claude에게만 전송돼요.</p>
        <button id="uploadGo" class="btn-generate" type="button" disabled>이 사진으로 만들기!</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" hidden aria-label="생성 결과">
      <div class="result-head">
        <h2>오늘의 자료</h2>
        <button id="pdfBtn" class="btn-pdf" type="button">PDF로 저장</button>
      </div>
      <div id="sheet"></div>
    </section>

    <footer>
      사진은 위키미디어 커먼즈(자유 이용 사진)에서 가져오고, 글자 읽기와 설명은 AI가 해요. 읽기·유래는 참고용으로 보고, 중요한 건 사전으로 한 번 더 확인하세요.
    </footer>
  </main>

<script>
/* ===== 설정 ===== */
const MODEL = "claude-sonnet-5-5";   // 모델을 바꾸고 싶으면 여기만 수정
const API_URL = "https://api.anthropic.com/v1/messages";
const COMMONS_API = "https://commons.wikimedia.org/w/api.php";
const MAX_TRIES = 3;                 // 글자가 안 읽히는 사진이면 다른 사진으로 최대 몇 번 다시 시도할지

// 위키미디어 커먼즈에서 사진을 찾을 때 쓰는 검색어
const SEARCH_TERMS = {
  sign: ["日本 看板 店", "居酒屋 看板", "ラーメン 看板", "japan restaurant signboard",
         "商店街 看板", "japanese shop sign noren", "うどん 看板", "寿司 看板"],
  menu: ["日本 メニュー 看板", "japanese restaurant menu board", "ラーメン メニュー",
         "居酒屋 メニュー", "izakaya menu japan", "食堂 メニュー", "定食 メニュー 看板"],
  station: ["駅 案内 看板", "japan train station sign platform", "駅 出口 案内",
            "乗り換え 案内 駅", "japan station exit sign", "のりば 番線 案内"],
  pop: ["スーパー 半額 値札", "japan supermarket price tag", "スーパー 特売 POP",
        "コンビニ 値札 日本", "japan convenience store sale sign"],
  warning: ["禁煙 看板 日本", "立入禁止 看板", "japan no smoking sign",
            "関係者以外立入禁止", "撮影禁止 看板", "japan warning sign prohibited"],
  vending: ["自動販売機 日本 ボタン", "japan vending machine drinks",
            "自動販売機 飲料 ホット", "japanese vending machine buttons"]
};
// Claude에게 알려줄 종류 이름
const KIND_LABEL = {
  sign: "가게 간판", menu: "메뉴판", station: "전철·역 안내판",
  pop: "마트·편의점 POP/가격표", warning: "주의·경고문", vending: "자판기 버튼"
};
const OK_MIME = ["image/jpeg", "image/png", "image/webp"];

const state = { usedTitles: new Set() };

/* ===== 작은 도구들 ===== */
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
// {味噌|みそ} → <ruby>味噌<rt>みそ</rt></ruby>
function ruby(s) {
  return esc(s).replace(/\{([^{}|]+)\|([^{}|]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}
// {味噌|みそ} → 味噌 (후리가나 제거)
function plain(s) {
  return String(s ?? "").replace(/\{([^{}|]+)\|[^{}|]+\}/g, "$1");
}
function stripHtml(h) {
  const doc = new DOMParser().parseFromString(h || "", "text/html");
  return (doc.body.textContent || "").trim();
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function setStatus(msg, isError = false) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (isError ? " error" : "");
}

/* ===== API 키 기억 (실패해도 동작에 지장 없음) ===== */
try {
  const saved = localStorage.getItem("jp_study_key");
  if (saved) { $("apiKey").value = saved; $("saveKey").checked = true; }
} catch (e) {}

/* ===== 1단계: 위키미디어 커먼즈에서 사진 후보 찾기 (API 키 필요 없음) ===== */
async function searchCommons(term, offset) {
  const params = new URLSearchParams({
    action: "query", format: "json", origin: "*",
    generator: "search", gsrsearch: `${term} filetype:bitmap`,
    gsrnamespace: "6", gsrlimit: "30", gsroffset: String(offset),
    prop: "imageinfo", iiprop: "url|mime|size|extmetadata", iiurlwidth: "1000"
  });
  const res = await fetch(`${COMMONS_API}?${params}`);
  if (!res.ok) throw new Error("사진 검색에 실패했어요. 잠시 후 다시 눌러 주세요.");
  const json = await res.json();
  return Object.values(json.query?.pages || {});
}

async function findPhotos(kindValue) {
  const kinds = Object.keys(SEARCH_TERMS);
  const kind = kindValue === "random" ? kinds[Math.floor(Math.random() * kinds.length)] : kindValue;
  const terms = SEARCH_TERMS[kind];
  const term = terms[Math.floor(Math.random() * terms.length)];

  let pages = await searchCommons(term, Math.floor(Math.random() * 40));
  if (!pages.length) pages = await searchCommons(term, 0);   // 범위를 넘어가면 처음부터

  const list = pages
    .map((p) => {
      const info = p.imageinfo?.[0];
      if (!info) return null;
      const meta = info.extmetadata || {};
      return {
        kind,
        title: p.title,
        thumb: info.thumburl || info.url,
        mime: info.mime,
        width: info.width || 0,
        pageUrl: info.descriptionurl,
        artist: stripHtml(meta.Artist?.value),
        license: stripHtml(meta.LicenseShortName?.value)
      };
    })
    .filter((c) => c && OK_MIME.includes(c.mime) && c.width >= 600 && !state.usedTitles.has(c.title));

  return shuffle(list);
}

// 사진을 내려받아 base64로 바꿈 (Claude에게 보내고, 화면/PDF에도 그대로 씀)
async function loadImage(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("사진을 내려받지 못했어요.");
  const blob = await res.blob();
  const mediaType = OK_MIME.includes(blob.type) ? blob.type : "image/jpeg";
  const dataUrl = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("사진을 읽지 못했어요."));
    r.readAsDataURL(blob);
  });
  return { mediaType, dataUrl, data: dataUrl.split(",")[1] };
}

/* ===== 2단계: Claude에게 사진을 보여주고 학습 자료 만들기 ===== */
const SYSTEM = `너는 한국인 일본어 학습자를 위한 교재 제작자다.
일본에서 찍은 사진 한 장이 주어진다(가게 간판, 메뉴판, 전철·역 안내판, 마트·편의점 POP/가격표, 주의·경고문, 자판기 중 하나).
사진에 실제로 보이는 일본어 글자로 학습 자료를 만든다. 일본 여행·생활에서 바로 쓸모 있는 글자를 우선 고른다.
- 역 안내판: 出口, 乗り換え, 番線, のりば, 方面 같은 표현과 읽는 법
- 마트 POP/가격표: 半額, 税込, 特売, 新商品 같은 표현과 가격 읽는 법
- 주의·경고문: 禁止, 立入禁止, 禁煙 같은 표현과 어떤 행동을 막는 말인지
- 자판기: 음료 이름, ホット/つめたい, 売切 같은 표현과 살 때 쓰는 말

규칙:
- 출력은 JSON 객체 하나뿐이다. 설명, 인사말, 코드블록(\`\`\`)을 붙이지 않는다.
- 사진에 일본어 글자가 또렷하게 읽히지 않거나, 위 종류에 해당하는 사진이 아니면 {"usable": false} 만 출력한다.
- jp에는 사진에서 확실히 읽히는 글자만 옮겨 적는다. 안 보이는 글자를 추측해서 채우지 않는다.
  메뉴판·가격표·자판기처럼 글자가 많으면 눈에 띄는 항목 1~3개만 골라 줄바꿈(\\n)으로 구분한다.
- 일본어 안의 한자 단어에는 {漢字|かんじ} 형식으로 히라가나 읽기를 붙인다. 예: {味噌|みそ}ラーメン, {営業中|えいぎょうちゅう}.
  간판 원문(jp)과 단어(word)의 한자에는 항상 붙인다. 일본어 설명·예문·퀴즈 질문에서는 학습자 수준(JLPT)에 비춰 어려운 한자에 붙인다
  (N5·N4는 거의 모든 한자, N3·N2는 어려운 한자, N1은 일반 학습자도 읽기 어려운 한자와 특수한 읽기에만).
  히라가나·가타카나에는 붙이지 않는다. 중괄호와 | 기호는 이 용도 외에는 쓰지 않는다.
- 일본어 설명·예문·질문의 어휘와 문장 난이도도 학습자 수준에 맞춘다. N1이면 자연스럽고 고급스러운 표현과 문체를 쓴다.
- 한국어 설명은 친근하고 쉬운 말투로 쓴다.
- origin_ko에는 뜻과 유래를 쓰고, 경고문·역 안내판·가격표처럼 유래보다 쓰임이 중요하면 현장에서 어떻게 쓰이는지, 조심할 점도 함께 쓴다. 유래는 정확한 것만 쓴다. 어원이 확실하지 않으면 지어내지 말고 "유래는 확실하지 않다"고 밝힌다.
  예시 방향: "미소라멘의 '미소(味噌)'는 일본 된장을 뜻하는 말로, 라멘 국물에 된장을 풀어서 붙은 이름이에요."
- 사진 속 사람의 얼굴이나 개인 정보는 다루지 않는다.
- 퀴즈는 5지선다이고 정답은 정확히 하나다. 오답도 그럴듯하게 만들고, 간판·설명·단어 안에서 풀 수 있는 문제로 낸다.

JSON 형식:
{
  "usable": true,
  "kind": "sign", "menu", "station", "pop", "warning", "vending" 중 하나,
  "where_ko": "사진이 어떤 장면인지 한 줄 (예: 라멘집 입구 간판)",
  "jp": "사진에서 읽은 원문 (후리가나 표기 포함)",
  "kana": "원문 전체를 히라가나로 읽은 것",
  "ko": "한국어 뜻",
  "explanation_ja": "그 간판/메뉴에 대한 일본어 설명 2~3문장 (학습자 수준에 맞게, 후리가나 표기 포함)",
  "explanation_ko": "위 일본어 설명의 한국어 번역",
  "origin_ko": "단어의 뜻과 유래(또는 현장 쓰임·주의점)를 알려주는 설명 2~4문장",
  "words": [
    { "word": "단어(후리가나 표기)", "reading": "히라가나 읽기", "ko": "한국어 뜻",
      "example_ja": "예문(후리가나 표기)", "example_ko": "예문 번역" }
  ],
  "quiz": {
    "question_ja": "일본어 질문 (후리가나 표기)",
    "question_ko": "질문의 한국어 번역",
    "choices": ["선택지1", "선택지2", "선택지3", "선택지4", "선택지5"],
    "answer_index": 0에서 4 사이 정수,
    "explanation_ko": "정답 해설"
  }
}
words는 4~5개이며, 사진 속 한자·단어와 그 글자를 이용한 관련 단어를 고른다.`;

async function callClaude(key, img, hintText) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 3500,
      system: SYSTEM,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: img.mediaType, data: img.data } },
          { type: "text", text: `${hintText}\n학습자 수준: JLPT ${$("level").value}` }
        ]
      }]
    })
  });

  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error?.message || ""; } catch (e) {}
    const hint = res.status === 401 ? " (API 키를 확인해 주세요)" :
                 res.status === 429 ? " (잠시 후 다시 시도해 주세요)" : "";
    throw new Error(`API 오류 ${res.status}${hint} ${detail}`.trim());
  }

  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  if (start < 0 || end < 0) return { usable: false };
  try { return JSON.parse(text.slice(start, end + 1)); }
  catch (e) { return { usable: false }; }
}

function isValid(d) {
  return d && d.usable !== false && d.jp && d.quiz &&
    Array.isArray(d.quiz.choices) && d.quiz.choices.length === 5 &&
    Number.isInteger(d.quiz.answer_index) && d.quiz.answer_index >= 0 && d.quiz.answer_index < 5;
}

/* ===== 화면 그리기 ===== */
const NUMS = ["①", "②", "③", "④", "⑤"];

function render(d, source, dataUrl) {
  const kind = Object.keys(KIND_LABEL).includes(d.kind) ? d.kind : "sign";

  // 퀴즈 선택지 섞기 (정답 위치가 한쪽에 몰리지 않게)
  const choices = d.quiz.choices.map((text, i) => ({ text, correct: i === d.quiz.answer_index }));
  const mixed = shuffle(choices);
  const answerNo = mixed.findIndex((c) => c.correct);

  const words = (d.words || []).map((w) => `
    <li>
      <div class="word-main">
        <span class="word-jp">${ruby(w.word)}</span>
        <span class="word-read">${esc(w.reading)}</span>
        <span class="word-ko">${esc(w.ko)}</span>
      </div>
      <p class="word-ex">${ruby(w.example_ja)}</p>
      <p class="word-ex-ko">${esc(w.example_ko)}</p>
    </li>`).join("");

  const choiceBtns = mixed.map((c, i) => `
    <li>
      <button type="button" class="choice" data-i="${i}">
        <span class="no">${NUMS[i]}</span><span>${esc(c.text)}</span>
      </button>
    </li>`).join("");

  let creditHtml;
  if (source.upload) {
    creditHtml = `<span class="credit">내가 올린 사진</span>`;
  } else {
    const credit = [source.artist && esc(source.artist), source.license && esc(source.license)].filter(Boolean).join(" · ");
    creditHtml = `<span class="credit">사진: <a href="${esc(source.pageUrl)}" target="_blank" rel="noopener">${esc(source.title.replace(/^File:/, ""))}</a>${credit ? " / " + credit : ""} (Wikimedia Commons)</span>`;
  }

  $("sheet").innerHTML = `
    <h2 class="print-title">일본어 공부 노트 — ${esc(plain(d.jp).replace(/\n/g, " "))} (${new Date().toLocaleDateString("ko-KR")})</h2>

    <figure class="photo">
      <img src="${dataUrl}" alt="${esc(d.where_ko)}">
      <figcaption>
        ${esc(d.where_ko)}<br>
        ${creditHtml}
      </figcaption>
    </figure>

    <div class="signboard ${kind}">
      <p class="jp">${ruby(d.jp)}</p>
      <p class="kana">${esc(d.kana)}</p>
      <p class="ko">${esc(d.ko)}</p>
    </div>

    <section class="section">
      <h3>일본어 설명</h3>
      <p class="explain-ja">${ruby(d.explanation_ja)}</p>
      <p class="explain-ko">${esc(d.explanation_ko)}</p>
      <div class="origin"><strong>뜻과 유래·현장 팁</strong><br>${esc(d.origin_ko)}</div>
    </section>

    <section class="section">
      <h3>이 사진으로 배우는 단어</h3>
      <ul class="words">${words}</ul>
    </section>

    <section class="section">
      <h3>퀴즈</h3>
      <p class="quiz-q">${ruby(d.quiz.question_ja)}</p>
      <p class="quiz-q-ko">${esc(d.quiz.question_ko)}</p>
      <ul class="choices">${choiceBtns}</ul>
      <div class="quiz-result" id="quizResult" hidden>
        <strong>정답: ${NUMS[answerNo]} ${esc(mixed[answerNo]?.text)}</strong><br>
        ${esc(d.quiz.explanation_ko)}
      </div>
    </section>
  `;

  // 퀴즈 클릭 처리
  const btns = [...document.querySelectorAll(".choice")];
  btns.forEach((btn) => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.i);
      btns.forEach((b) => (b.disabled = true));
      btns[answerNo].classList.add("correct");
      if (i !== answerNo) btn.classList.add("wrong");
      $("quizResult").hidden = false;
    });
  });
}

/* ===== 공통: API 키 확인 / 버튼 잠금 / 결과 보여주기 ===== */
function getKey() {
  // 공백·줄바꿈·보이지 않는 글자(제로폭 문자 등)를 모두 지움
  const key = $("apiKey").value.replace(/[\s\u200B-\u200D\uFEFF]/g, "");
  $("apiKey").value = key;
  if (!key) { setStatus("API 키를 먼저 넣어 주세요.", true); return null; }
  // 헤더에는 영문·숫자·기호(ASCII)만 들어갈 수 있음
  if (/[^\x21-\x7E]/.test(key)) {
    setStatus("API 키에 한글이나 특수문자가 섞여 있어요. 'sk-ant-'로 시작하는 키만 다시 복사해서 붙여넣어 주세요.", true);
    try { localStorage.removeItem("jp_study_key"); } catch (e) {}
    return null;
  }
  try {
    if ($("saveKey").checked) localStorage.setItem("jp_study_key", key);
    else localStorage.removeItem("jp_study_key");
  } catch (e) {}
  return key;
}

function setBusy(busy) {
  $("generate").disabled = busy;
  $("generate").textContent = busy ? "만드는 중…" : "생성하기!";
  $("uploadGo").disabled = busy || !selectedFile;
  $("uploadGo").textContent = busy ? "만드는 중…" : "이 사진으로 만들기!";
}

function showResult(data, source, dataUrl) {
  render(data, source, dataUrl);
  $("result").hidden = false;
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ===== 탭: 자동으로 찾기 / 내 사진 올리기 ===== */
function setMode(mode) {
  const isAuto = mode === "auto";
  $("tabAuto").classList.toggle("active", isAuto);
  $("tabUpload").classList.toggle("active", !isAuto);
  $("tabAuto").setAttribute("aria-selected", String(isAuto));
  $("tabUpload").setAttribute("aria-selected", String(!isAuto));
  $("panelAuto").hidden = !isAuto;
  $("panelUpload").hidden = isAuto;
  setStatus("");
}
$("tabAuto").addEventListener("click", () => setMode("auto"));
$("tabUpload").addEventListener("click", () => setMode("upload"));

/* ===== 생성하기! (사진 자동으로 찾기) ===== */
$("generate").addEventListener("click", async () => {
  const key = getKey();
  if (!key) return;

  setBusy(true);
  try {
    setStatus("일본 간판·메뉴 사진을 찾고 있어요…");
    const candidates = await findPhotos($("kind").value);
    if (!candidates.length) throw new Error("맞는 사진을 못 찾았어요. 다시 눌러 주세요.");

    let done = false;
    let tries = 0;
    for (const cand of candidates) {
      if (tries >= MAX_TRIES) break;

      let img;
      try { img = await loadImage(cand.thumb); } catch (e) { continue; }   // 내려받기 실패한 사진은 건너뜀

      tries++;
      state.usedTitles.add(cand.title);
      setStatus(`사진 속 글자를 읽는 중이에요… (${tries}/${MAX_TRIES})  10~20초 걸려요.`);

      const hint = `사진 종류(참고): ${KIND_LABEL[cand.kind]}\n파일 제목(참고만, 사진에 실제로 보이는 글자를 우선): ${cand.title}`;
      const data = await callClaude(key, img, hint);
      if (!isValid(data)) continue;   // 글자가 안 읽히는 사진이면 다른 사진으로

      showResult(data, cand, img.dataUrl);
      done = true;
      break;
    }

    if (!done) throw new Error("글자가 또렷한 사진을 못 찾았어요. 한 번 더 눌러 주세요.");
    setStatus("");
  } catch (err) {
    setStatus(err.message || "알 수 없는 오류가 났어요.", true);
  } finally {
    setBusy(false);
  }
});

/* ===== 내 사진 올리기 ===== */
let selectedFile = null;
let previewUrl = null;

function chooseFile(file) {
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  if (!file) { selectedFile = null; $("preview").hidden = true; $("uploadGo").disabled = true; return; }
  if (!file.type.startsWith("image/")) {
    selectedFile = null; $("preview").hidden = true; $("uploadGo").disabled = true;
    setStatus("이미지 파일만 올릴 수 있어요. (JPG, PNG, WEBP)", true);
    return;
  }
  selectedFile = file;
  previewUrl = URL.createObjectURL(file);
  $("preview").src = previewUrl;
  $("preview").hidden = false;
  $("uploadGo").disabled = false;
  setStatus("");
}

// 큰 사진(폰 사진 등)은 긴 변 1600px 이하 JPEG로 줄여서 보냄 (전송 한도·속도 때문)
async function fileToImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error("이 사진 형식은 브라우저에서 열 수 없어요. JPG나 PNG로 바꿔서 올려 주세요. (아이폰 HEIC 사진은 변환이 필요할 수 있어요)"));
      i.src = url;
    });
    const MAX = 1600;
    const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";            // 투명 PNG는 흰 배경으로
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    return { mediaType: "image/jpeg", dataUrl, data: dataUrl.split(",")[1] };
  } finally {
    URL.revokeObjectURL(url);
  }
}

$("photoFile").addEventListener("change", (e) => chooseFile(e.target.files[0]));

// 끌어다 놓기
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => chooseFile(e.dataTransfer?.files?.[0]));

$("uploadGo").addEventListener("click", async () => {
  if (!selectedFile) { setStatus("사진을 먼저 골라 주세요.", true); return; }
  const key = getKey();
  if (!key) return;

  setBusy(true);
  try {
    setStatus("사진을 준비하고 있어요…");
    const img = await fileToImage(selectedFile);
    setStatus("사진 속 글자를 읽는 중이에요… 10~20초 걸려요.");

    const hint = "사진 종류: 모름 (사용자가 직접 올린 사진이다. 사진을 보고 가장 가까운 종류로 판단한다)";
    const data = await callClaude(key, img, hint);
    if (!isValid(data)) {
      throw new Error("이 사진에서는 일본어 글자를 또렷하게 읽지 못했어요. 글자가 크고 선명하게 나온 사진으로 다시 올려 주세요.");
    }
    showResult(data, { upload: true }, img.dataUrl);
    setStatus("");
  } catch (err) {
    setStatus(err.message || "알 수 없는 오류가 났어요.", true);
  } finally {
    setBusy(false);
  }
});

/* ===== PDF 저장: 브라우저 인쇄 창에서 'PDF로 저장' 선택 ===== */
$("pdfBtn").addEventListener("click", () => window.print());
</script>
